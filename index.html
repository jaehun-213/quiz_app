<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT 지식 퀴즈</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>IT 지식 퀴즈</h1>
    </header>
    
    <main id="quiz-container">
        <div id="progress-info">
            <span id="question-counter">문제 1 / 3</span>
            <span id="score-display">점수: 0</span>
        </div>
        
        <div id="question-text">
            <!-- 질문이 여기에 표시됩니다 -->
        </div>
        
        <div id="answer-area">
            <!-- 문제 유형에 따라 답변 UI가 동적으로 삽입됩니다 -->
        </div>
        
        <div id="feedback-area">
            <!-- 정답/오답 피드백이 여기에 표시됩니다 -->
        </div>
        
        <button id="submit-btn">제출</button>
    </main>
    
    <script src="script.js"></script>
</body>
</html>

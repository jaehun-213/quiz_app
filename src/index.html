<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT 기술 퀴즈 앱</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <!-- 메인 컨테이너 -->
    <main class="app-container">
        <!-- 헤더 섹션 -->
        <header class="app-header">
            <h1 class="app-title">IT 기술 퀴즈</h1>
            <nav class="user-nav">
                <span id="user-info" class="user-info hidden"></span>
                <button id="logout-btn" class="btn btn-secondary hidden">로그아웃</button>
            </nav>
        </header>

        <!-- 로그인 뷰 -->
        <section id="login-view" class="view">
            <div class="login-container">
                <h2 class="view-title">로그인</h2>
                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="login-email">이메일</label>
                        <input type="email" id="login-email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">비밀번호</label>
                        <input type="password" id="login-password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">로그인</button>
                </form>
                
                <div class="auth-divider">
                    <span>또는</span>
                </div>
                
                <button id="show-register" class="btn btn-outline">회원가입</button>
            </div>
        </section>

        <!-- 회원가입 뷰 -->
        <section id="register-view" class="view hidden">
            <div class="register-container">
                <h2 class="view-title">회원가입</h2>
                <form id="register-form" class="auth-form">
                    <div class="form-group">
                        <label for="register-email">이메일</label>
                        <input type="email" id="register-email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">비밀번호</label>
                        <input type="password" id="register-password" name="password" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="register-confirm">비밀번호 확인</label>
                        <input type="password" id="register-confirm" name="confirmPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary">회원가입</button>
                </form>
                
                <div class="auth-divider">
                    <span>또는</span>
                </div>
                
                <button id="show-login" class="btn btn-outline">로그인</button>
            </div>
        </section>

        <!-- 퀴즈 뷰 -->
        <section id="quiz-view" class="view hidden">
            <div class="quiz-container">
                <!-- 퀴즈 헤더 -->
                <div class="quiz-header">
                    <div class="quiz-progress">
                        <span id="question-counter">문제 1 / 10</span>
                        <div class="progress-bar">
                            <div id="progress-fill" class="progress-fill"></div>
                        </div>
                    </div>
                    <div class="quiz-score">
                        <span>점수: <span id="current-score">0</span></span>
                    </div>
                </div>

                <!-- 퀴즈 콘텐츠 -->
                <div class="quiz-content">
                    <div class="question-container">
                        <h3 id="question-text" class="question-text"></h3>
                        <div id="question-code" class="question-code hidden">
                            <pre><code id="code-content"></code></pre>
                        </div>
                    </div>

                    <!-- 객관식 답안 -->
                    <div id="multiple-choice" class="answer-container hidden">
                        <div class="options-list">
                            <!-- 동적으로 생성될 옵션들 -->
                        </div>
                    </div>

                    <!-- 빈칸 채우기 답안 -->
                    <div id="fill-in-blank" class="answer-container hidden">
                        <div class="blank-container">
                            <input type="text" id="blank-input" class="blank-input" placeholder="답을 입력하세요">
                        </div>
                    </div>

                    <!-- 서술형 답안 -->
                    <div id="short-answer" class="answer-container hidden">
                        <div class="textarea-container">
                            <textarea id="answer-textarea" class="answer-textarea" placeholder="답을 입력하세요"></textarea>
                        </div>
                    </div>
                </div>

                <!-- 퀴즈 액션 버튼 -->
                <div class="quiz-actions">
                    <button id="submit-btn" class="btn btn-primary">제출</button>
                    <button id="next-btn" class="btn btn-secondary hidden">다음 문제</button>
                </div>
            </div>
        </section>

        <!-- 결과 뷰 -->
        <section id="results-view" class="view hidden">
            <div class="results-container">
                <h2 class="view-title">퀴즈 결과</h2>
                <div class="score-display">
                    <div class="final-score">
                        <span class="score-label">최종 점수</span>
                        <span id="final-score" class="score-value">0</span>
                    </div>
                    <div class="score-details">
                        <p>정답: <span id="correct-count">0</span> / <span id="total-questions">0</span></p>
                        <p>정답률: <span id="accuracy">0</span>%</p>
                    </div>
                </div>
                
                <div class="results-actions">
                    <button id="retry-quiz" class="btn btn-primary">다시 풀기</button>
                    <button id="view-ranking" class="btn btn-secondary">랭킹 보기</button>
                </div>
            </div>
        </section>

        <!-- 랭킹 뷰 -->
        <section id="ranking-view" class="view hidden">
            <div class="ranking-container">
                <h2 class="view-title">실시간 랭킹</h2>
                <div class="ranking-header">
                    <button id="refresh-ranking" class="btn btn-outline">새로고침</button>
                    <span class="last-updated">마지막 업데이트: <span id="last-updated-time">-</span></span>
                </div>
                
                <div class="ranking-list">
                    <div class="ranking-item ranking-header-item">
                        <span class="rank">순위</span>
                        <span class="user">사용자</span>
                        <span class="score">점수</span>
                        <span class="date">날짜</span>
                    </div>
                    <div id="ranking-list-content">
                        <!-- 동적으로 생성될 랭킹 리스트 -->
                    </div>
                </div>
                
                <div class="ranking-actions">
                    <button id="back-to-quiz" class="btn btn-primary">퀴즈 풀기</button>
                    <button id="back-to-home" class="btn btn-secondary">홈으로</button>
                </div>
            </div>
        </section>
    </main>

    <!-- 로딩 오버레이 -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-spinner"></div>
        <p class="loading-text">로딩 중...</p>
    </div>

    <!-- 알림 메시지 -->
    <div id="notification" class="notification hidden">
        <span id="notification-message"></span>
        <button id="close-notification" class="close-btn">&times;</button>
    </div>

    <!-- Firebase SDK CDN -->
    <script type="module">
        // Firebase 설정 확인 및 초기화
        let auth, db;
        let createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged;
        let collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp;
        
        try {
            // Firebase 모듈 동적 import
            const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
            const { getAuth, createUserWithEmailAndPassword: createUser, signInWithEmailAndPassword: signIn, signOut: signOutUser, onAuthStateChanged: onAuthState } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
            const { getFirestore, collection: getCollection, addDoc: addDocument, getDocs: getDocuments, query: getQuery, orderBy: orderByField, limit: limitTo, serverTimestamp: serverTime } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
            
            // Firebase 설정 (데모용 - 실제 사용 시에는 본인의 Firebase 프로젝트 설정을 사용하세요)
            const firebaseConfig = {
                apiKey: "AIzaSyD_y2djj8OZIp98S7VSoZm8-6c0pI819Po",
                authDomain: "quiz-app-e4a22.firebaseapp.com",
                projectId: "quiz-app-e4a22",
                storageBucket: "quiz-app-e4a22.firebasestorage.app",
                messagingSenderId: "325550263667",
                appId: "1:325550263667:web:41769ba5105bda8d4d0906",
                measurementId: "G-L6T84FBYJN"
            };
            
            // Firebase 초기화
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            
            // 함수들 할당
            createUserWithEmailAndPassword = createUser;
            signInWithEmailAndPassword = signIn;
            signOut = signOutUser;
            onAuthStateChanged = onAuthState;
            collection = getCollection;
            addDoc = addDocument;
            getDocs = getDocuments;
            query = getQuery;
            orderBy = orderByField;
            limit = limitTo;
            serverTimestamp = serverTime;
            
            console.log('Firebase 초기화 성공');
            
        } catch (error) {
            console.error('Firebase 초기화 실패:', error);
            console.log('Firebase 없이 로컬 모드로 실행합니다.');
            
            // Firebase 없이 작동하는 모의 함수들
            auth = null;
            db = null;
            createUserWithEmailAndPassword = mockCreateUser;
            signInWithEmailAndPassword = mockSignIn;
            signOut = mockSignOut;
            onAuthStateChanged = mockOnAuthStateChanged;
            collection = mockCollection;
            addDoc = mockAddDoc;
            getDocs = mockGetDocs;
            query = mockQuery;
            orderBy = mockOrderBy;
            limit = mockLimit;
            serverTimestamp = mockServerTimestamp;
        }
        
        // 전역 변수로 설정
        window.auth = auth;
        window.db = db;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.query = query;
        window.orderBy = orderBy;
        window.limit = limit;
        window.serverTimestamp = serverTimestamp;
        
        // Firebase 없이 작동하는 모의 함수들
        function mockCreateUser(auth, email, password) {
            return new Promise((resolve, reject) => {
                // 로컬 스토리지에 사용자 정보 저장
                const user = {
                    uid: 'local_' + Date.now(),
                    email: email,
                    emailVerified: true
                };
                localStorage.setItem('currentUser', JSON.stringify(user));
                resolve({ user });
            });
        }
        
        function mockSignIn(auth, email, password) {
            return new Promise((resolve, reject) => {
                // 로컬 스토리지에서 사용자 확인
                const storedUser = localStorage.getItem('currentUser');
                if (storedUser) {
                    const user = JSON.parse(storedUser);
                    if (user.email === email) {
                        resolve({ user });
                    } else {
                        reject(new Error('auth/user-not-found'));
                    }
                } else {
                    reject(new Error('auth/user-not-found'));
                }
            });
        }
        
        function mockSignOut(auth) {
            return new Promise((resolve) => {
                localStorage.removeItem('currentUser');
                resolve();
            });
        }
        
        function mockOnAuthStateChanged(auth, callback) {
            // 즉시 현재 상태 확인
            const storedUser = localStorage.getItem('currentUser');
            if (storedUser) {
                callback(JSON.parse(storedUser));
            } else {
                callback(null);
            }
            // 변경 감지를 위한 간단한 폴링
            setInterval(() => {
                const currentUser = localStorage.getItem('currentUser');
                if (currentUser) {
                    callback(JSON.parse(currentUser));
                } else {
                    callback(null);
                }
            }, 1000);
        }
        
        function mockCollection(db, collectionName) {
            return { _path: collectionName };
        }
        
        function mockAddDoc(collectionRef, data) {
            return new Promise((resolve) => {
                const id = 'doc_' + Date.now();
                const docData = { ...data, id };
                const key = collectionRef._path + '_' + id;
                localStorage.setItem(key, JSON.stringify(docData));
                resolve({ id });
            });
        }
        
        function mockGetDocs(queryRef) {
            return new Promise((resolve) => {
                const docs = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith(queryRef._path + '_')) {
                        const data = JSON.parse(localStorage.getItem(key));
                        docs.push({ id: data.id, data: () => data });
                    }
                }
                resolve({ forEach: (callback) => docs.forEach(callback), empty: docs.length === 0 });
            });
        }
        
        function mockQuery(collectionRef, ...constraints) {
            return collectionRef;
        }
        
        function mockOrderBy(field, direction) {
            return { field, direction };
        }
        
        function mockLimit(count) {
            return { count };
        }
        
        function mockServerTimestamp() {
            return new Date();
        }
    </script>
    
    <!-- 메인 스크립트 -->
    <script type="module" src="script.js"></script>
</body>
</html>
